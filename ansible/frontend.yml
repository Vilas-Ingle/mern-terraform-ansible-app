
---
- name: Deploy TravelMemory frontend with Nginx
  hosts: web
  become: true

  vars:
    frontend_dir: /var/www/travelmemory

  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create frontend directory
      ansible.builtin.file:
        path: "{{ frontend_dir }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Copy React production build
      ansible.builtin.copy:
        src: ../app-source/frontend/build/
        dest: "{{ frontend_dir }}/"
        owner: www-data
        group: www-data
        mode: "0644"
      notify: Reload Nginx

    - name: Configure Nginx for TravelMemory
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/travelmemory
        owner: root
        group: root
        mode: "0644"
        content: |
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name _;

              root {{ frontend_dir }};
              index index.html;

              location / {
                  try_files $uri $uri/ /index.html;
              }

              location /api/ {
                  rewrite ^/api/(.*)$ /$1 break;
                  proxy_pass http://127.0.0.1:3001;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
      notify: Reload Nginx

    - name: Enable TravelMemory Nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/travelmemory
        dest: /etc/nginx/sites-enabled/travelmemory
        state: link
      notify: Reload Nginx

    - name: Disable default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload Nginx

    - name: Validate Nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Enable and start Nginx
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: started

  handlers:
    - name: Reload Nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
